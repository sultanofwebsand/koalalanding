<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPMA Show 2026 Registration</title>

<style>

/* ===============================
   Base page styling
   =============================== */

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #0a2141;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}


/* ===============================
   Main container
   =============================== */

.main-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
}


/* ===============================
   Form card container
   =============================== */

.form-card {
    background: #ffffff;
    width: 100%;
    max-width: 720px;
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    overflow: hidden;
}


/* ===============================
   Responsive iframe wrapper
   =============================== */

.iframe-wrapper {
    position: relative;
    width: 100%;
    height: 1100px;
}

.iframe-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
}


/* ===============================
   Footer styling (Reg.buzz match)
   =============================== */

footer {
    background-color: #f3f4f6;
    color: #6b7280;
    text-align: center;
    font-size: 13px;
    padding: 22px 12px;
    border-top: 1px solid #e5e7eb;
}

footer a {
    color: #6b7280;
    text-decoration: none;
    margin: 0 8px;
}

footer a:hover {
    text-decoration: underline;
}


/* ===============================
   Mobile optimisation
   =============================== */

@media (max-width: 768px) {

    .main-wrapper {
        padding: 30px 12px;
    }

    .iframe-wrapper {
        height: 1400px;
    }

}

</style>

</head>

<body>

<div class="main-wrapper">

    <div class="form-card">

        <div class="iframe-wrapper">

            <!-- Replace with your Jotform embed URL -->

           
    <iframe
      id="JotFormIFrame-261023777041350"
      title="PPMA Landing"
      onload="window.parent.scrollTo(0,0)"
      allowtransparency="true"
      allow="geolocation; microphone; camera; fullscreen; payment"
      src="https://form.jotform.com/261023777041350"
      frameborder="0"
      style="min-width:100%;max-width:100%;height:839px;border:none;"
      scrolling="no"
    >
    </iframe>
    <script src='https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js'></script>
    <script>window.jotformEmbedHandler("iframe[id='JotFormIFrame-261023777041350']", "https://form.jotform.com/")</script>
    

        </div>

    </div>

</div>


<footer>

    © 2026 PPMA Show

    <a href="/privacy-policy/">Privacy Policy</a> |
    <a href="/terms/">Terms</a> |
    <a href="/contact/">Contact</a>

</footer>


</body>
</html>
