<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPMA Show 2026 Registration</title>

<style>

/* ===============================
   Base page styling
   =============================== */

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #0a2141;
    color: #0f172a;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}


/* ===============================
   Main container
   =============================== */

.main-wrapper {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
}


/* ===============================
   Jotform container
   =============================== */

.form-shell {
    width: 100%;
    max-width: 1040px;
    margin: 0 auto;
}


/* ===============================
   Iframe styling
   =============================== */

.jotform-embed {
    width: 1px;
    min-width: 100%;
    border: 0;
    display: block;
    background: transparent;
    min-height: 2200px;
}


/* ===============================
   Footer styling
   =============================== */

footer {
    background-color: #e5e7eb;
    color: #6b7280;
    text-align: center;
    font-size: 13px;
    line-height: 1.6;
    padding: 18px 12px;
    border-top: 1px solid #d1d5db;
}

footer a {
    color: #6b7280;
    text-decoration: none;
    margin: 0 8px;
    white-space: nowrap;
}

footer a:hover {
    text-decoration: underline;
}


/* ===============================
   Mobile optimisation
   =============================== */

@media (max-width: 768px) {

    .main-wrapper {
        padding: 20px 10px 30px;
    }

    .form-shell {
        max-width: 100%;
    }

    .jotform-embed {
        min-height: 2600px;
    }

    footer {
        font-size: 12px;
        padding: 16px 10px;
    }

    footer a {
        display: inline-block;
        margin: 4px 6px;
    }
}

</style>
</head>
<body>

<div class="main-wrapper">
    <div class="form-shell">

        <iframe
            id="JotFormIFrame-261023777041350"
            class="jotform-embed"
            title="PPMA Landing"
            allowtransparency="true"
            allow="geolocation; microphone; camera; fullscreen; payment"
            src="https://form.jotform.com/261023777041350"
            scrolling="no">
        </iframe>

    </div>
</div>

<footer>
    © 2026 PPMA Show
    <a href="https://www.ppmashow.co.uk/privacy-policy">Privacy Policy</a> |
    <a href="https://www.ppmashow.co.uk/admissions-policy">Admissions Policy</a> |
    <a href="https://www.ppmashow.co.uk/visit/venue-travel">Directions</a>
</footer>

<script src="https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js"></script>
<script>
window.jotformEmbedHandler(
    "iframe[id='JotFormIFrame-261023777041350']",
    "https://form.jotform.com/"
);
</script>

</body>
</html>
