<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PPMA Show 2026 Registration</title>

<style>

/* ===============================
   Base page styling
   =============================== */

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f5f6f8; /* matches Reg.buzz-style background */
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}


/* ===============================
   Main container
   =============================== */

.main-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 20px;
}


/* ===============================
   Form card container
   =============================== */

.form-card {
    background: #ffffff;
    width: 100%;
    max-width: 720px;
    border-radius: 6px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    padding: 0;
    overflow: hidden;
}


/* ===============================
   Responsive iframe wrapper
   =============================== */

.iframe-wrapper {
    position: relative;
    width: 100%;
    height: 1100px;
}

.iframe-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
}


/* ===============================
   Footer styling
   =============================== */

footer {
    background-color: #2c2c2c;
    color: #ffffff;
    text-align: center;
    padding: 18px 10px;
    font-size: 14px;
}

footer a {
    color: #ffffff;
    text-decoration: underline;
}

footer a:hover {
    opacity: 0.8;
}


/* ===============================
   Mobile optimisation
   =============================== */

@media (max-width: 768px) {

    .main-wrapper {
        padding: 30px 12px;
    }

    .iframe-wrapper {
        height: 1400px;
    }

}

</style>

</head>

<body>

<div class="main-wrapper">

    <div class="form-card">

        <div class="iframe-wrapper">

            <!-- REPLACE THIS URL WITH YOUR JOTFORM EMBED LINK -->

            <iframe
                src="https://form.jotform.com/YOUR-FORM-ID"
                scrolling="no">
            </iframe>

        </div>

    </div>

</div>


<footer>

    © 2026 PPMA Show |
    <a href="/privacy-policy/">Privacy Policy</a>

</footer>


</body>
</html>
